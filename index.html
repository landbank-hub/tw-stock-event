<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股事件驅動信號洞察平台（示範版）</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#667085;--line:#dfe3e8;--brand:#14365d;--up:#d92d20;--down:#12805c;--warn:#b54708}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--ink:#e8ecf1;--mute:#98a2b3;--line:#2c3744;--brand:#7fb0ea;--up:#ff6b5e;--down:#3ccf91;--warn:#f5a54a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{background:var(--brand);color:#fff;padding:18px 16px 0}
@media(prefers-color-scheme:dark){header{background:#0b2a4a}}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:1.35rem;margin:0}
header p{margin:2px 0 12px;font-size:.85rem;opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:transparent;color:#fff;border:0;padding:10px 14px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;opacity:.8}
nav button[aria-selected=true]{border-color:#fff;opacity:1;font-weight:700}
main{padding:20px 16px 40px}
.demo{background:#fff4e5;color:#7a4100;border:1px solid #f5c98b;border-radius:6px;padding:8px 12px;font-size:.85rem;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#10151c}}
.tag{font-size:.78rem;padding:1px 8px;border-radius:4px;background:var(--brand);color:#fff}
@media(prefers-color-scheme:dark){.tag{color:#10151c}}
.imp-高{color:var(--up);font-weight:700}.imp-中{color:var(--warn);font-weight:700}.imp-低{color:var(--mute);font-weight:700}
.stk{border:1px solid var(--brand);color:var(--brand);background:transparent;border-radius:999px;padding:2px 10px;font:inherit;font-size:.85rem;cursor:pointer}
h2{font-size:1.1rem;margin:0 0 6px}h3{font-size:1rem;margin:14px 0 6px}
.mute{color:var(--mute);font-size:.88rem}
.up{color:var(--up)}.dn{color:var(--down)}
input[type=text]{width:100%;max-width:340px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--card);color:var(--ink)}
.big{font-size:1.8rem;font-weight:700}
.badge{display:inline-block;padding:2px 10px;border-radius:4px;font-size:.85rem;font-weight:700;border:1px solid}
.p-未定價{color:var(--up)}.p-部分定價{color:var(--warn)}.p-已定價{color:var(--mute)}
.chain{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.node{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
.node[aria-pressed=true]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.path span.n{background:var(--card);border:1px solid var(--line);padding:3px 10px;border-radius:6px}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
footer{max-width:860px;margin:0 auto;padding:0 16px 30px;color:var(--mute);font-size:.8rem}
</style>
</head>
<body>
<header><div class="wrap">
<h1>台股事件驅動信號洞察平台</h1>
<p>把新聞、政策、財報，變成看得懂的投資信號</p>
<nav role="tablist" id="tabs"></nav>
</div></header>
<main><div class="wrap">
<div class="demo">這是示範版：所有事件、股價、目標價都是虛構的範例資料，不是真實行情。</div>
<div id="view"></div>
</div></main>
<footer>本平台僅供資訊參考，不構成投資建議。投資有風險，請自行判斷並評估風險。</footer>

<script>
// ===== 範例資料（想改內容，只要改這一區） =====
var TODAY = "2026/10/24";
var STOCKS = {
  "2330":{name:"台積電",price:1050,pct:2.5,vol:35000,target:[1100,1150],exp:"+5% ~ +10%",pricing:"部分定價"},
  "6505":{name:"台塑化",price:78.4,pct:3.1,vol:21800,target:[82,88],exp:"+5% ~ +12%",pricing:"未定價"},
  "2603":{name:"長榮",price:192.5,pct:-1.2,vol:48200,target:[175,185],exp:"-9% ~ -4%",pricing:"未定價"},
  "2308":{name:"台達電",price:402,pct:1.4,vol:9800,target:[420,445],exp:"+4% ~ +10%",pricing:"部分定價"},
  "3711":{name:"日月光投控",price:168,pct:1.9,vol:15600,target:[172,182],exp:"+2% ~ +8%",pricing:"已定價"},
  "2002":{name:"中鋼",price:24.6,pct:0.8,vol:30500,target:[25.5,27],exp:"+4% ~ +10%",pricing:"未定價"}
};
var EVENTS = [
  {id:1,cat:"地緣政治",imp:"高",title:"伊朗威脅波斯灣航運，國際油價急漲",stocks:["6505","2603"],note:"油價上漲有利煉油，但航運成本與航線風險增加。"},
  {id:2,cat:"產業政策",imp:"中",title:"工業互聯網聯盟成立，推動智慧製造",stocks:["2308"],note:"工廠自動化需求被看好。"},
  {id:3,cat:"公司財報",imp:"高",title:"晶圓代工龍頭法說會，展望優於市場預期",stocks:["2330","3711"],note:"先進製程需求強，封測同步受惠。"},
  {id:4,cat:"自然災害",imp:"中",title:"東部地震，部分工地暫停施工",stocks:["2002"],note:"短期工程延宕，後續重建可能帶動鋼材需求。"},
  {id:5,cat:"法規變更",imp:"低",title:"金管會調整上市櫃公司資訊揭露規範",stocks:[],note:"對個股影響有限。"}
];
var CATS=["全部","地緣政治","產業政策","公司財報","自然災害","人事異動","法規變更"];
var IMPS=["全部","高","中","低"];
var CHAINS = {
  "半導體":{up:"設備、矽晶圓、IC 設計工具",mid:"晶圓代工、記憶體",down:"封裝測試、電子終端產品"},
  "AI 伺服器":{up:"GPU 與先進封裝、散熱零組件",mid:"伺服器代工與組裝",down:"雲端服務、資料中心"},
  "電動車":{up:"電池材料、車用晶片",mid:"電池、電控、驅動",down:"整車製造、充電設備"},
  "金融":{up:"央行利率與資金面",mid:"銀行、保險、證券",down:"企業放款、消費者信貸"},
  "生技":{up:"原料藥、研發服務",mid:"新藥、醫材開發",down:"醫院、藥通路"},
  "傳產":{up:"原油、鐵礦、塑化原料",mid:"鋼鐵、塑化、水泥",down:"營建、汽車、民生用品"}
};
var PATHS = [
  ["地震","鋼鐵","營建"],
  ["油價上漲","塑化原料","塑膠製品"],
  ["美國對晶片出口管制","設備廠","晶圓代工"]
];
var SUMMARY = {
  top:[1,3,4],
  advice:"短線留意油價與航運股的反向走勢；半導體相關個股已部分反映利多，追高前先確認自己的資金配置。"
};
// ===== 程式（一般不需要改） =====
var state={tab:"radar",cat:"全部",imp:"全部",sym:"2330",chain:"半導體",watch:[]};
try{state.watch=JSON.parse(localStorage.getItem("watch")||"[]")}catch(e){}
var TABS=[["radar","事件雷達"],["stock","個股分析"],["chain","產業鏈地圖"],["daily","每日摘要"],["watch","自選股"]];
function save(){try{localStorage.setItem("watch",JSON.stringify(state.watch))}catch(e){}}
function pct(p){return '<span class="'+(p>=0?'up':'dn')+'">'+(p>=0?'▲ ':'▼ ')+Math.abs(p).toFixed(1)+'%</span>'}
function chips(list,key){return list.map(function(o){return '<button class="chip" aria-pressed="'+(state[key]===o)+'" data-k="'+key+'" data-v="'+o+'">'+o+'</button>'}).join("")}
function stkBtn(s){return '<button class="stk" data-go="'+s+'">'+STOCKS[s].name+' '+s+'</button>'}
function eventCard(e){
  return '<div class="card"><div class="row"><span class="tag">'+e.cat+'</span><span class="imp-'+e.imp+'">影響：'+e.imp+'</span></div>'+
  '<h2 style="margin-top:8px">'+e.title+'</h2><div class="mute">'+e.note+'</div>'+
  (e.stocks.length?'<div class="row" style="margin-top:8px"><span class="mute">相關個股</span>'+e.stocks.map(stkBtn).join("")+'</div>':'')+'</div>'
}
function viewRadar(){
  var list=EVENTS.filter(function(e){return(state.cat==="全部"||e.cat===state.cat)&&(state.imp==="全部"||e.imp===state.imp)});
  return '<h2>今日重大事件　<span class="mute">'+TODAY+'</span></h2>'+
  '<div class="row" style="margin:10px 0 4px"><span class="mute">事件類型</span>'+chips(CATS,"cat")+'</div>'+
  '<div class="row" style="margin-bottom:14px"><span class="mute">影響程度</span>'+chips(IMPS,"imp")+'</div>'+
  (list.length?list.map(eventCard).join(""):'<div class="card mute">這個條件下沒有事件，請放寬篩選。</div>')
}
function viewStock(){
  var s=STOCKS[state.sym], rel=EVENTS.filter(function(e){return e.stocks.indexOf(state.sym)>-1});
  var inW=state.watch.indexOf(state.sym)>-1;
  return '<h2>個股分析</h2><div class="row" style="margin-bottom:12px"><input type="text" id="q" placeholder="輸入代號或名稱，例如 2330 或 台積電"><button class="chip" id="search">搜尋</button></div><div id="msg" class="mute"></div>'+
  '<div class="card"><div class="row" style="justify-content:space-between"><h2>'+s.name+'（'+state.sym+'）</h2><button class="chip" id="wbtn">'+(inW?'移出自選股':'加入自選股')+'</button></div>'+
  '<div class="big">'+s.price+' '+pct(s.pct)+'</div><div class="mute">成交量 '+s.vol.toLocaleString()+' 張（示範資料）</div></div>'+
  '<div class="card"><h3 style="margin-top:0">事件驅動的目標價區間</h3>目標價 <b>'+s.target[0]+' – '+s.target[1]+'</b>　預期漲跌幅 <b>'+s.exp+'</b><br>定價狀態　<span class="badge p-'+s.pricing+'">'+s.pricing+'</span>'+
  '<div class="mute" style="margin-top:6px">定價狀態：未定價＝市場還沒反映；部分定價＝已反映一部分；已定價＝多半已反映在股價。</div></div>'+
  '<h3>近期相關事件</h3>'+(rel.length?rel.map(eventCard).join(""):'<div class="card mute">目前沒有相關事件。</div>')
}
function viewChain(){
  var c=CHAINS[state.chain];
  return '<h2>產業鏈地圖</h2><div class="mute">點選產業，查看上中下游。</div><div class="chain">'+
  Object.keys(CHAINS).map(function(k){return '<button class="node" aria-pressed="'+(state.chain===k)+'" data-k="chain" data-v="'+k+'">'+k+'</button>'}).join("")+'</div>'+
  '<div class="card"><h3 style="margin-top:0">'+state.chain+'</h3><b>上游</b>：'+c.up+'<br><b>中游</b>：'+c.mid+'<br><b>下游</b>：'+c.down+'</div>'+
  '<h3>事件傳導路徑範例</h3>'+PATHS.map(function(p){return '<div class="path">'+p.map(function(n){return '<span class="n">'+n+'</span>'}).join('<span class="mute">→</span>')+'</div>'}).join("")
}
function viewDaily(){
  var evs=SUMMARY.top.map(function(id){return EVENTS.filter(function(e){return e.id===id})[0]});
  var set={};evs.forEach(function(e){e.stocks.forEach(function(s){set[s]=1})});
  return '<h2>今日投資信號摘要　<span class="mute">'+TODAY+'</span></h2><h3>最重要的事件</h3>'+evs.map(eventCard).join("")+
  '<h3>受影響個股</h3><div class="row">'+Object.keys(set).map(stkBtn).join("")+'</div>'+
  '<h3>短期觀察重點</h3><div class="card">'+SUMMARY.advice+'<div class="mute" style="margin-top:6px">僅供參考，非投資建議。</div></div>'
}
function viewWatch(){
  var rows=state.watch.map(function(s){var rel=EVENTS.filter(function(e){return e.stocks.indexOf(s)>-1});
    return '<div class="card"><div class="row" style="justify-content:space-between">'+stkBtn(s)+'<span>'+STOCKS[s].price+' '+pct(STOCKS[s].pct)+'</span></div><div class="mute" style="margin-top:6px">'+(rel.length?'相關事件：'+rel.map(function(e){return e.title}).join('；'):'目前沒有相關事件')+'</div></div>'}).join("");
  return '<h2>我的自選股</h2><div class="mute">清單只存在你這台裝置的瀏覽器。Email／LINE 通知需要後端伺服器，示範版尚未提供。</div><div style="margin-top:12px">'+(rows||'<div class="card mute">還沒有自選股。到「個股分析」頁按「加入自選股」。</div>')+'</div>'
}
var VIEWS={radar:viewRadar,stock:viewStock,chain:viewChain,daily:viewDaily,watch:viewWatch};
function render(){
  document.getElementById("tabs").innerHTML=TABS.map(function(t){return '<button role="tab" aria-selected="'+(state.tab===t[0])+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join("");
  document.getElementById("view").innerHTML=VIEWS[state.tab]();
}
function doSearch(){
  var q=document.getElementById("q").value.trim(), hit=null;
  Object.keys(STOCKS).forEach(function(k){if(k===q||STOCKS[k].name.indexOf(q)>-1)hit=hit||k});
  if(hit&&q){state.sym=hit;render()}else document.getElementById("msg").textContent="示範版只有這幾檔："+Object.keys(STOCKS).map(function(k){return STOCKS[k].name+k}).join("、");
}
document.addEventListener("click",function(ev){
  var t=ev.target;
  if(t.dataset.tab){state.tab=t.dataset.tab;render()}
  else if(t.dataset.k){state[t.dataset.k]=t.dataset.v;render()}
  else if(t.dataset.go){state.sym=t.dataset.go;state.tab="stock";render();window.scrollTo(0,0)}
  else if(t.id==="search")doSearch();
  else if(t.id==="wbtn"){var i=state.watch.indexOf(state.sym);if(i>-1)state.watch.splice(i,1);else state.watch.push(state.sym);save();render()}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="q")doSearch()});
render();
</script>
</body>
</html>
